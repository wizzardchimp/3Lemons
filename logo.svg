<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 96" role="img" aria-label="3Bells">
  <defs>
    <linearGradient id="bellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe566"/>
      <stop offset="50%" stop-color="#f7b731"/>
      <stop offset="100%" stop-color="#d4920f"/>
    </linearGradient>
    <filter id="soft" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
    <g id="bell">
      <path d="M-7.5 0 a7.5 7.5 0 0 1 15 0 c0 5 -2.5 9 -4.5 12 h-6 c-2 -3 -4.5 -7 -4.5 -12 Z" fill="url(#bellGrad)"/>
      <path d="M-9 12.5 h18" stroke="#9a6a00" stroke-width="2" stroke-linecap="round"/>
      <circle cx="0" cy="18" r="2.4" fill="#9a6a00"/>
      <circle cx="-3" cy="-4" r="1.5" fill="#fff8c4" opacity="0.7"/>
    </g>
  </defs>

  <!-- mark -->
  <rect x="4" y="12" width="72" height="72" rx="18" fill="#1a1a2e"/>
  <g filter="url(#soft)">
    <use href="#bell" transform="translate(27 56) scale(1.5) rotate(-7 0 0)"/>
    <use href="#bell" transform="translate(40 56) scale(1.5)"/>
    <use href="#bell" transform="translate(53 56) scale(1.5) rotate(7 0 0)"/>
  </g>

  <!-- wordmark -->
  <text x="92" y="58" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="36" font-weight="750" fill="#1a1a2e" letter-spacing="-0.5">3Bells</text>
  <text x="94" y="78" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#888" letter-spacing="1.5">DAILY TAKINGS</text>
</svg>
