<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="3Lemons">
  <defs>
    <linearGradient id="lg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe566"/>
      <stop offset="55%" stop-color="#f7b731"/>
      <stop offset="100%" stop-color="#e09b12"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="#1a1a2e"/>
  <!-- three lemons -->
  <g filter="url(#s)">
    <ellipse cx="22" cy="34" rx="11" ry="14" fill="url(#lg)" transform="rotate(-18 22 34)"/>
    <ellipse cx="32" cy="28" rx="11" ry="14" fill="url(#lg)" transform="rotate(8 32 28)"/>
    <ellipse cx="44" cy="36" rx="11" ry="14" fill="url(#lg)" transform="rotate(22 44 36)"/>
  </g>
  <!-- leaves -->
  <ellipse cx="28" cy="16" rx="5" ry="3" fill="#3d9a4a" transform="rotate(-30 28 16)"/>
  <ellipse cx="36" cy="15" rx="5" ry="3" fill="#2f8a3c" transform="rotate(25 36 15)"/>
  <path d="M32 12v8" stroke="#1f6b2a" stroke-width="1.5" stroke-linecap="round"/>
  <!-- highlight dots -->
  <circle cx="26" cy="30" r="1.6" fill="#fff8c4" opacity="0.7"/>
  <circle cx="35" cy="24" r="1.4" fill="#fff8c4" opacity="0.65"/>
  <circle cx="47" cy="32" r="1.5" fill="#fff8c4" opacity="0.65"/>
</svg>
