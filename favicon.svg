<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="3Bells">
  <defs>
    <linearGradient id="lg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe566"/>
      <stop offset="55%" stop-color="#f7b731"/>
      <stop offset="100%" stop-color="#e09b12"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-opacity="0.25"/>
    </filter>
    <g id="bell">
      <path d="M-7.5 0 a7.5 7.5 0 0 1 15 0 c0 5 -2.5 9 -4.5 12 h-6 c-2 -3 -4.5 -7 -4.5 -12 Z" fill="url(#lg)"/>
      <path d="M-9 12.5 h18" stroke="#9a6a00" stroke-width="2" stroke-linecap="round"/>
      <circle cx="0" cy="18" r="2.4" fill="#9a6a00"/>
      <circle cx="-3" cy="-4" r="1.5" fill="#fff8c4" opacity="0.7"/>
    </g>
  </defs>
  <rect width="64" height="64" rx="14" fill="#1a1a2e"/>
  <!-- three bells -->
  <g filter="url(#s)">
    <use href="#bell" transform="translate(22 36) rotate(-8 22 36)"/>
    <use href="#bell" transform="translate(32 36)"/>
    <use href="#bell" transform="translate(44 36) rotate(8 44 36)"/>
  </g>
</svg>
